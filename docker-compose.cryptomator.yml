services:
  oubi:
    init: true
    tmpfs:
      - /mnt/oubi-crypt:mode=1777
    security_opt:
      - apparmor:unconfined
    cap_add:
      - SYS_ADMIN
    devices:
      - /dev/fuse:/dev/fuse
    volumes:
      - ${OUBI_CRYPT:?Set OUBI_CRYPT to the vault directory}:/crypt
    environment:
      OUBI_CRYPT_OUTPUT: ${OUBI_CRYPT_OUTPUT:-Sorted}
