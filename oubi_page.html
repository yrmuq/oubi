<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>oubi</title>
<style>
:root {
  color-scheme: light;
  --bg: #f2f2f2;
  --text: #1c1c1c;
  --muted: #5e5e5e;
  --pane: #fff;
  --line: #c6c6c6;
  --folder-tab: #d7a441;
  --folder: #e7b84a;
  --folder-front: #f6d78a;
  --folder-edge: #8a5a12;
  --yellow: #f5c400;
  --blue: #2f6fed;
  --iron-a: #f7f8f9;
  --iron-b: #8d98a3;
  --iron-c: #d5dbe0;
  --bar: #e4e4e4;
  --fill: #e7b341;
  --btn: #2c4a3e;
  --btn-2: #dedede;
  --btn-2-text: #1c1c1c;
  --danger: #8d3a3a;
  --pick: #c98400;
  --log: 200px;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #111;
    --text: #eee;
    --muted: #aaa;
    --pane: #161616;
    --line: #3a3a3a;
    --folder-tab: #e0b44a;
    --folder: #f0c85a;
    --folder-front: #ffe39a;
    --folder-edge: #6a4310;
    --yellow: #f5c400;
    --blue: #4c86ff;
    --iron-a: #f4f6f8;
    --iron-b: #7e8b97;
    --iron-c: #c5ced6;
    --bar: #2a2a2a;
    --fill: #e7b341;
    --btn: #2c4a3e;
    --btn-2: #333;
    --btn-2-text: #fff;
    --danger: #6e2e2e;
    --pick: #e7b341;
  }
}
html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text); font: 15px/1.4 system-ui, sans-serif; }
body { display: grid; grid-template-rows: auto minmax(0, 1fr) 8px var(--log); }
.topbar { display: flex; align-items: center; justify-content: space-between; height: 48px; padding: 0 16px; border-bottom: 1px solid var(--line); background: var(--pane); }
.brand { font-size: 18px; font-weight: 650; }
.themes { display: flex; gap: 4px; }
.themes button { padding: 4px 10px; background: var(--btn-2); color: var(--btn-2-text); }
.themes button.on { background: var(--btn); color: #fff; }
.top { display: grid; grid-template-columns: minmax(0, 1.15fr) 8px minmax(0, 1fr) 8px minmax(0, 1.15fr); min-height: 0; padding: 0 8px; }
.pane { border: 1px solid var(--line); background: var(--pane); margin: 8px 0; padding: 12px; min-width: 0; min-height: 0; display: flex; flex-direction: column; }
h1 { font-size: 16px; margin: 0 0 8px; font-weight: 600; }
.buttons { display: flex; flex-wrap: wrap; gap: 8px; }
button { font: inherit; color: #fff; background: var(--btn); border: 0; border-radius: 8px; padding: 8px 10px; cursor: pointer; }
button.secondary { background: var(--btn-2); color: var(--btn-2-text); }
button.danger { background: var(--danger); color: #fff; }
button:disabled { opacity: 0.45; cursor: default; }
#folders, #out { flex: 1; min-height: 0; overflow: auto; display: flex; flex-wrap: wrap; align-content: flex-start; gap: 14px; margin-top: 16px; padding: 4px; }
#folders { margin-top: 40px; margin-left: 24px; }
.folder { width: 104px; background: transparent; color: inherit; border: 2px solid transparent; border-radius: 8px; padding: 4px; box-sizing: border-box; }
.folder .icon { width: 72px; height: 56px; margin: 0 auto 6px; position: relative; background: none; border: 0; }
.folder .icon svg { width: 100%; height: 100%; display: block; }
.folder .name { display: block; font-size: 12px; line-height: 1.2; word-break: break-word; }
.folder.on { border-color: var(--pick); }
.badge { position: absolute; bottom: 7px; width: 14px; height: 14px; border-radius: 50%; box-sizing: border-box; }
.badge.scan { left: 12px; }
.badge.sort { right: 12px; }
.badge.none { background: var(--yellow); border: 1px solid #8a6d00; }
.badge.part { background: var(--blue); border: 1px solid #1d4fb5; }
.badge.done { background: #3dba6a; border: 1px solid #1e7a3a; }
.split { position: relative; touch-action: none; }
.split-v { cursor: col-resize; margin: 8px 0; }
.split-h { cursor: row-resize; }
.split-v::after, .split-h::after { content: ""; position: absolute; }
.split-v::after { left: -6px; right: -6px; top: 0; bottom: 0; }
.split-h::after { left: 8px; right: 8px; top: -6px; bottom: -6px; }
.step { margin-top: auto; }
.bar { height: 10px; background: var(--bar); border-radius: 99px; overflow: hidden; }
.bar > div { height: 100%; width: 0; background: var(--fill); }
.detail { color: var(--muted); min-height: 1.2em; }
.mid { position: relative; align-items: center; text-align: center; gap: 12px; }
#shot { width: 100%; height: 60%; min-height: 208px; flex: 0 0 60%; object-fit: contain; background: #000; border: 1px solid var(--line); cursor: zoom-in; }
#switch { position: relative; width: 100%; height: 32px; flex: 0 0 32px; }
#prev, #next { position: absolute; top: 0; z-index: 2; background: transparent; color: var(--text); font-size: 22px; }
#prev { left: 0; }
#next { right: 0; }
#name { display: block; width: 100%; padding: 0 52px; box-sizing: border-box; }
#who { margin: 0; min-height: 1.2em; font-size: 18px; }
#tags { white-space: pre-wrap; margin: 0; width: 100%; overflow: auto; }
.out { text-align: left; }
.out button.file { display: block; width: 100%; text-align: left; background: transparent; color: inherit; border-radius: 0; border: 0; }
.log { margin: 0 8px 8px; border: 1px solid var(--line); background: var(--pane); overflow: auto; padding: 8px; white-space: pre-wrap; font: 13px/1.35 ui-monospace, monospace; min-height: 0; }
#zoom { position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center; overflow: hidden; background: #000; }
#zoom[hidden] { display: none; }
#zoom-close { position: absolute; top: 12px; right: 12px; z-index: 2; font-size: 32px; line-height: 1; background: transparent; color: #fff; }
#zoom-img { max-width: 100%; max-height: 100%; transform-origin: center center; user-select: none; }
#zoom-img.zoomed { cursor: grab; }
html[data-theme="light"] {
  color-scheme: light;
  --bg: #f2f2f2; --text: #1c1c1c; --muted: #5e5e5e; --pane: #fff; --line: #c6c6c6;
  --folder-tab: #d7a441; --folder: #e7b84a; --folder-front: #f6d78a; --folder-edge: #8a5a12;
  --bar: #e4e4e4; --btn-2: #dedede; --btn-2-text: #1c1c1c; --danger: #8d3a3a; --pick: #c98400;
}
html[data-theme="dark"] {
  color-scheme: dark;
  --bg: #111; --text: #eee; --muted: #aaa; --pane: #161616; --line: #3a3a3a;
  --folder-tab: #e0b44a; --folder: #f0c85a; --folder-front: #ffe39a; --folder-edge: #6a4310;
  --yellow: #f5c400; --blue: #4c86ff; --iron-a: #f4f6f8; --iron-b: #7e8b97; --iron-c: #c5ced6;
  --bar: #2a2a2a; --btn-2: #333; --btn-2-text: #fff; --danger: #6e2e2e; --pick: #e7b341;
}
</style>
<script>
var savedTheme = "__OUBI_THEME__";
if (savedTheme === "light" || savedTheme === "dark") document.documentElement.setAttribute("data-theme", savedTheme);
</script>
</head>
<body>
<header class="topbar">
  <span class="brand">oubi</span>
  <div class="themes">
    <button type="button" data-theme="light">светлая</button>
    <button type="button" data-theme="dark">тёмная</button>
    <button type="button" data-theme="auto">auto</button>
  </div>
</header>
<div class="top">
  <section class="pane" id="left">
    <div class="buttons">
      <button id="tag">Опознать</button>
      <button id="sort">Сортировать</button>
      <button id="plan" class="secondary">План сортировки</button>
      <button id="stop" class="danger" disabled>Остановить</button>
      <button id="retry" class="secondary" hidden>Повторить скачивание модели</button>
    </div>
    <div id="folders"></div>
    <p id="step" class="step">Открываю…</p>
    <div class="bar"><div id="fill"></div></div>
    <p id="detail" class="detail"></p>
  </section>
  <div class="split split-v" id="split-left"></div>
  <section class="pane mid" id="mid">
    <img id="shot" alt="">
    <div id="switch">
      <button id="prev" type="button">❮</button>
      <button id="next" type="button">❯</button>
    </div>
    <span id="name"></span>
    <p id="who"></p>
    <p id="tags"></p>
  </section>
  <div class="split split-v" id="split-mid"></div>
  <section class="pane" id="right">
    <div id="out" class="out"></div>
  </section>
</div>
<div class="split split-h" id="split-log"></div>
<pre id="log" class="log"></pre>
<div id="zoom" hidden>
  <button id="zoom-close" type="button">×</button>
  <img id="zoom-img" alt="">
</div>
<script>
const selected = new Set();
let folders = FOLDERS_JSON;
let reel = [];
let reelAt = -1;
let follow = true;
let outputPath = "";
let shown = "";
let theme = savedTheme === "light" || savedTheme === "dark" || savedTheme === "auto" ? savedTheme : "auto";
let wasBusy = false;
const panes = { left: null, mid: null, right: null, log: 200 };

function fileName(path) {
  const parts = String(path || "").split("/");
  return parts[parts.length - 1] || "";
}

function badge(kind, state) {
  const title = {
    scan: { none: "не опознавалась", part: "опознана не до конца", done: "опознана полностью" },
    sort: { none: "не сортировалась", part: "отсортирована не до конца", done: "отсортирована полностью" },
  }[kind][state] || "";
  if (!title) return "";
  return `<span class="badge ${kind} ${state}" title="${title}"></span>`;
}

function folderIcon(scan, sort) {
  const icon = document.createElement("div");
  icon.className = "icon";
  icon.innerHTML = `<svg viewBox="0 0 64 52" aria-hidden="true">
    <path fill="var(--folder-tab)" d="M8 18h14l4-8h24a4 4 0 0 1 4 4v8H8z"/>
    <path fill="var(--folder)" stroke="var(--folder-edge)" stroke-width="1.4" d="M4 18h56a4 4 0 0 1 4 4v22a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4V18z"/>
    <path fill="var(--folder-front)" d="M4 28h56v16a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4V28z"/>
  </svg>` + badge("scan", scan) + badge("sort", sort);
  return icon;
}

function renderFolders() {
  const box = document.getElementById("folders");
  box.innerHTML = "";
  for (const folder of folders) {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "folder" + (selected.has(folder.path) ? " on" : "");
    const label = document.createElement("span");
    label.className = "name";
    label.textContent = folder.name;
    button.append(folderIcon(folder.scan, folder.sort), label);
    button.onclick = () => {
      if (selected.has(folder.path)) selected.delete(folder.path);
      else selected.add(folder.path);
      renderFolders();
      loadRecent();
    };
    box.appendChild(button);
  }
}

function takeFolders(data) {
  const prev = new Map(folders.map((folder) => [folder.path, folder]));
  folders = data.map((folder) => {
    if (!folder.scan && prev.has(folder.path) && prev.get(folder.path).scan) {
      const old = prev.get(folder.path);
      return Object.assign({}, folder, { scan: old.scan, sort: old.sort });
    }
    return folder;
  });
  renderFolders();
}

async function loadFolders() {
  try {
    const data = await (await fetch("/api/folders")).json();
    if (!Array.isArray(data)) return;
    takeFolders(data);
  } catch (error) {
    return;
  }
}

async function loadRecent() {
  if (!selected.size) {
    reel = [];
    return;
  }
  const query = [...selected].map((folder) => "folder=" + encodeURIComponent(folder)).join("&");
  const data = await (await fetch("/api/recent?" + query)).json();
  reel = data.files || [];
  if (follow && reel.length) showAt(reel.length - 1);
}

function showAt(index) {
  if (!reel.length) return;
  reelAt = (index + reel.length) % reel.length;
  showImage("images", reel[reelAt]);
}

async function showImage(root, path) {
  if (!path) return;
  shown = root + ":" + path;
  document.getElementById("shot").src = "/api/file?root=" + root + "&path=" + encodeURIComponent(path);
  document.getElementById("name").textContent = fileName(path);
  document.getElementById("who").textContent = "";
  document.getElementById("tags").textContent = "";
  if (root !== "images") return;
  const data = await (await fetch("/api/tags?path=" + encodeURIComponent(path))).json();
  document.getElementById("who").textContent = (data.character || "").split("_").join(" ");
  document.getElementById("tags").textContent = data.text || "";
}

async function loadOutput() {
  const data = await (await fetch("/api/browse?root=output&path=" + encodeURIComponent(outputPath))).json();
  const box = document.getElementById("out");
  box.innerHTML = "";
  if (data.parent !== null && data.parent !== undefined) {
    const back = document.createElement("button");
    back.type = "button";
    back.textContent = "Назад";
    back.onclick = () => { outputPath = data.parent; loadOutput(); };
    box.appendChild(back);
  }
  for (const item of data.items || []) {
    const button = document.createElement("button");
    button.type = "button";
    if (item.dir) {
      button.className = "folder";
      const label = document.createElement("span");
      label.className = "name";
      label.textContent = item.name;
      button.append(folderIcon("", ""), label);
    } else {
      button.className = "file";
      button.textContent = item.name;
    }
    button.onclick = () => {
      if (item.dir) {
        outputPath = item.path;
        loadOutput();
      } else {
        follow = false;
        showImage("output", item.path);
      }
    };
    box.appendChild(button);
  }
}

async function tick() {
  const data = await (await fetch("/api/status")).json();
  let step = data.step || "Жду.";
  const named = step.match(/Сейчас: размечаю (.+) \((\d+ из \d+)\)/);
  if (named) step = "Сейчас: размечаю " + fileName(named[1]) + " (" + named[2] + ").";
  document.getElementById("step").textContent = step;
  document.getElementById("detail").textContent = data.detail || "";
  document.getElementById("fill").style.width = (data.percent || 0) + "%";
  const log = document.getElementById("log");
  log.textContent = (data.log || []).join(String.fromCharCode(10));
  log.scrollTop = log.scrollHeight;
  const busy = data.job_running;
  const ready = data.model === "ready";
  const picked = selected.size > 0;
  for (const id of ["tag", "sort", "plan"]) {
    document.getElementById(id).disabled = busy || !picked || (id === "tag" && !ready);
  }
  document.getElementById("stop").disabled = !busy;
  document.getElementById("retry").hidden = data.model !== "error";
  if (wasBusy && !busy) loadFolders();
  wasBusy = !!busy;
  if (follow && data.preview_file && data.preview_file !== (reel[reelAt] || "")) {
    if (!reel.includes(data.preview_file)) reel.push(data.preview_file);
    showAt(reel.indexOf(data.preview_file));
  }
}

async function start(mode) {
  await fetch("/api/job", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ mode, folders: [...selected] }),
  });
  follow = true;
  tick();
}

function paintPanes() {
  const top = document.querySelector(".top");
  if (panes.left == null) return;
  top.style.gridTemplateColumns = panes.left + "px 8px " + panes.mid + "px 8px " + panes.right + "px";
  document.body.style.gridTemplateRows = "auto minmax(0,1fr) 8px " + panes.log + "px";
}

function dragSplit(which, event) {
  if (event.button !== undefined && event.button !== 0) return;
  event.preventDefault();
  const left = document.getElementById("left");
  const mid = document.getElementById("mid");
  const right = document.getElementById("right");
  const log = document.getElementById("log");
  const start = {
    x: event.clientX,
    y: event.clientY,
    left: left.getBoundingClientRect().width,
    mid: mid.getBoundingClientRect().width,
    right: right.getBoundingClientRect().width,
    log: log.getBoundingClientRect().height,
    top: document.querySelector(".top").getBoundingClientRect().height,
  };
  function move(ev) {
    if (which === "left") {
      const pair = start.left + start.mid;
      const floor = Math.min(96, pair / 2);
      const next = Math.min(pair - floor, Math.max(floor, start.left + ev.clientX - start.x));
      panes.left = next;
      panes.mid = pair - next;
      panes.right = start.right;
    } else if (which === "mid") {
      const pair = start.mid + start.right;
      const floor = Math.min(96, pair / 2);
      const next = Math.min(pair - floor, Math.max(floor, start.mid + ev.clientX - start.x));
      panes.left = start.left;
      panes.mid = next;
      panes.right = pair - next;
    } else {
      const pair = start.log + start.top;
      const floor = Math.min(72, pair / 5);
      panes.log = Math.min(pair - 120, Math.max(floor, start.log + (start.y - ev.clientY)));
      if (panes.left == null) {
        panes.left = start.left;
        panes.mid = start.mid;
        panes.right = start.right;
      }
    }
    paintPanes();
  }
  function up() {
    window.removeEventListener("pointermove", move);
    window.removeEventListener("pointerup", up);
  }
  window.addEventListener("pointermove", move);
  window.addEventListener("pointerup", up);
}

function applyTheme(next) {
  theme = next;
  if (next === "light" || next === "dark") document.documentElement.setAttribute("data-theme", next);
  else document.documentElement.removeAttribute("data-theme");
  for (const button of document.querySelectorAll(".themes button")) {
    button.classList.toggle("on", button.dataset.theme === next);
  }
}
applyTheme(theme);
for (const button of document.querySelectorAll(".themes button")) {
  button.onclick = () => {
    applyTheme(button.dataset.theme);
    fetch("/api/theme", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ theme: button.dataset.theme }),
    });
  };
}
for (const id of ["tag", "sort", "plan"]) document.getElementById(id).onclick = () => start(id);
document.getElementById("stop").onclick = () => fetch("/api/stop", { method: "POST" });
document.getElementById("retry").onclick = () => fetch("/api/download", { method: "POST" });
document.getElementById("prev").onclick = () => { follow = false; showAt(reelAt - 1); };
document.getElementById("next").onclick = () => { follow = false; showAt(reelAt + 1); };
document.getElementById("split-left").onpointerdown = (event) => dragSplit("left", event);
document.getElementById("split-mid").onpointerdown = (event) => dragSplit("mid", event);
document.getElementById("split-log").onpointerdown = (event) => dragSplit("log", event);
const zoom = document.getElementById("zoom");
const zoomImg = document.getElementById("zoom-img");
const view = { scale: 1, x: 0, y: 0, drag: null };
function paintZoom() {
  zoomImg.style.transform = "translate(" + view.x + "px, " + view.y + "px) scale(" + view.scale + ")";
  zoomImg.classList.toggle("zoomed", view.scale > 1);
}
function closeZoom() {
  zoom.hidden = true;
  view.drag = null;
}
document.getElementById("shot").onclick = () => {
  if (!document.getElementById("shot").src) return;
  view.scale = 1;
  view.x = 0;
  view.y = 0;
  view.drag = null;
  zoomImg.src = document.getElementById("shot").src;
  zoom.hidden = false;
  paintZoom();
};
document.getElementById("zoom-close").onclick = closeZoom;
document.addEventListener("keydown", (event) => {
  if (zoom.hidden) return;
  if (event.key === "Escape") closeZoom();
  if (event.key === "ArrowRight" || event.key === "ArrowLeft") {
    event.preventDefault();
    if (!reel.length) return;
    follow = false;
    showAt(reelAt + (event.key === "ArrowRight" ? 1 : -1));
    zoomImg.src = document.getElementById("shot").src;
    view.scale = 1;
    view.x = 0;
    view.y = 0;
    view.drag = null;
    paintZoom();
  }
});
zoom.addEventListener("wheel", (event) => {
  event.preventDefault();
  const next = view.scale * (event.deltaY < 0 ? 1.12 : 1 / 1.12);
  view.scale = Math.min(8, Math.max(1, next));
  if (view.scale === 1) {
    view.x = 0;
    view.y = 0;
  }
  paintZoom();
}, { passive: false });
zoomImg.addEventListener("mousedown", (event) => {
  if (event.button !== 0 || view.scale <= 1) return;
  view.drag = { x: event.clientX, y: event.clientY, ox: view.x, oy: view.y };
  event.preventDefault();
});
window.addEventListener("mousemove", (event) => {
  if (!view.drag) return;
  view.x = view.drag.ox + event.clientX - view.drag.x;
  view.y = view.drag.oy + event.clientY - view.drag.y;
  paintZoom();
});
window.addEventListener("mouseup", () => { view.drag = null; });
loadFolders();
loadOutput();
renderFolders();
tick();
setInterval(tick, 1000);
setInterval(loadFolders, 8000);
</script>
</body>
</html>
