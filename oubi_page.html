<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>oubi</title>
<style>
:root { color-scheme: dark; }
html, body { height: 100%; margin: 0; background: #111; color: #eee; font: 15px/1.4 system-ui, sans-serif; }
body { display: grid; grid-template-rows: 1fr 200px; }
.top { display: grid; grid-template-columns: 1.15fr 1fr 1.15fr; min-height: 0; }
.pane { border: 1px solid #d7d7d7; margin: 8px; padding: 12px; min-width: 0; min-height: 0; display: flex; flex-direction: column; }
h1 { font-size: 16px; margin: 0 0 8px; font-weight: 600; }
.buttons { display: flex; flex-wrap: wrap; gap: 8px; }
button { font: inherit; color: #fff; background: #2c4a3e; border: 0; border-radius: 8px; padding: 8px 10px; cursor: pointer; }
button.secondary { background: #333; }
button.danger { background: #6e2e2e; }
button:disabled { opacity: 0.45; cursor: default; }
#folders, #out { flex: 1; min-height: 0; overflow: auto; display: flex; flex-wrap: wrap; align-content: flex-start; gap: 14px; margin-top: 16px; }
.folder { width: 96px; background: #1b1b1b; color: #eee; border: 1px solid #aaa; border-radius: 8px; padding: 8px 4px; }
.folder .icon { width: 64px; height: 48px; margin: 0 auto 6px; border: 2px solid #eee; border-radius: 3px; position: relative; background: #2a2a2a; }
.folder .name { display: block; font-size: 12px; line-height: 1.2; word-break: break-word; }
.folder.on { outline: 2px solid #e7b341; }
.badge { position: absolute; bottom: 2px; width: 16px; height: 16px; border-radius: 50%; border: 1px solid #aaa; background: #111; font-size: 11px; line-height: 16px; }
.badge.scan { left: 2px; }
.badge.sort { right: 2px; }
.badge.part { background: #e7b341; color: #111; }
.badge.done { background: #3dba6a; color: #111; }
.step { margin-top: auto; }
.bar { height: 10px; background: #2a2a2a; border-radius: 99px; overflow: hidden; }
.bar > div { height: 100%; width: 0; background: #e7b341; }
.detail { color: #aaa; min-height: 1.2em; }
.mid { position: relative; align-items: center; text-align: center; gap: 12px; }
#shot { width: 100%; height: 60%; min-height: 208px; flex: 0 0 60%; object-fit: contain; background: #000; border: 1px solid #ddd; cursor: zoom-in; }
#switch { position: relative; width: 100%; height: 32px; flex: 0 0 32px; }
#prev, #next { position: absolute; top: 0; z-index: 2; background: transparent; font-size: 22px; }
#prev { left: 0; }
#next { right: 0; }
#name { display: block; width: 100%; padding: 0 52px; box-sizing: border-box; }
#who { margin: 0; min-height: 1.2em; font-size: 18px; }
#tags { white-space: pre-wrap; margin: 0; width: 100%; overflow: auto; }
.out { text-align: left; }
.out button.file { display: block; width: 100%; text-align: left; background: transparent; border-radius: 0; border: 0; }
.log { margin: 0 8px 8px; border: 1px solid #d7d7d7; overflow: auto; padding: 8px; white-space: pre-wrap; font: 13px/1.35 ui-monospace, monospace; }
#zoom { position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center; overflow: hidden; background: #000; }
#zoom[hidden] { display: none; }
#zoom-close { position: absolute; top: 12px; right: 12px; z-index: 2; font-size: 32px; line-height: 1; background: transparent; }
#zoom-img { max-width: 100%; max-height: 100%; transform-origin: center center; user-select: none; }
#zoom-img.zoomed { cursor: grab; }
</style>
</head>
<body>
<div class="top">
  <section class="pane">
    <h1>oubi</h1>
    <div class="buttons">
      <button id="tag">Опознать</button>
      <button id="sort">Сортировать</button>
      <button id="plan" class="secondary">План сортировки</button>
      <button id="stop" class="danger" disabled>Остановить</button>
      <button id="retry" class="secondary" hidden>Повторить скачивание модели</button>
    </div>
    <div id="folders"></div>
    <p id="step" class="step">Открываю…</p>
    <div class="bar"><div id="fill"></div></div>
    <p id="detail" class="detail"></p>
  </section>
  <section class="pane mid">
    <img id="shot" alt="">
    <div id="switch">
      <button id="prev" type="button">❮</button>
      <button id="next" type="button">❯</button>
    </div>
    <span id="name"></span>
    <p id="who"></p>
    <p id="tags"></p>
  </section>
  <section class="pane">
    <div id="out" class="out"></div>
  </section>
</div>
<pre id="log" class="log"></pre>
<div id="zoom" hidden>
  <button id="zoom-close" type="button">×</button>
  <img id="zoom-img" alt="">
</div>
<script>
const selected = new Set();
let folders = FOLDERS_JSON;
let reel = [];
let reelAt = -1;
let follow = true;
let outputPath = "";
let shown = "";

function fileName(path) {
  const parts = String(path || "").split("/");
  return parts[parts.length - 1] || "";
}

function badge(kind, state) {
  const title = {
    scan: { none: "ещё не размечалась", part: "размечена не до конца", done: "размечена полностью" },
    sort: { none: "ещё не раскладывалась", part: "разложена не до конца", done: "разложена полностью" },
  }[kind][state] || "";
  const mark = state === "done" ? "✓" : state === "part" ? "½" : "";
  return `<span class="badge ${kind} ${state}" title="${title}">${mark}</span>`;
}

function renderFolders() {
  const box = document.getElementById("folders");
  box.innerHTML = "";
  for (const folder of folders) {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "folder" + (selected.has(folder.path) ? " on" : "");
    const icon = document.createElement("div");
    icon.className = "icon";
    icon.innerHTML = badge("scan", folder.scan) + badge("sort", folder.sort);
    const label = document.createElement("span");
    label.className = "name";
    label.textContent = folder.name;
    button.append(icon, label);
    button.onclick = () => {
      if (selected.has(folder.path)) selected.delete(folder.path);
      else selected.add(folder.path);
      renderFolders();
      loadRecent();
    };
    box.appendChild(button);
  }
}

async function loadFolders() {
  try {
    const data = await (await fetch("/api/folders")).json();
    if (!Array.isArray(data)) return;
    folders = data;
    renderFolders();
  } catch (error) {
    return;
  }
}

async function loadRecent() {
  if (!selected.size) {
    reel = [];
    return;
  }
  const query = [...selected].map((folder) => "folder=" + encodeURIComponent(folder)).join("&");
  const data = await (await fetch("/api/recent?" + query)).json();
  reel = data.files || [];
  if (follow && reel.length) showAt(reel.length - 1);
}

function showAt(index) {
  if (!reel.length) return;
  reelAt = (index + reel.length) % reel.length;
  showImage("images", reel[reelAt]);
}

async function showImage(root, path) {
  if (!path) return;
  shown = root + ":" + path;
  document.getElementById("shot").src = "/api/file?root=" + root + "&path=" + encodeURIComponent(path);
  document.getElementById("name").textContent = fileName(path);
  document.getElementById("who").textContent = "";
  document.getElementById("tags").textContent = "";
  if (root !== "images") return;
  const data = await (await fetch("/api/tags?path=" + encodeURIComponent(path))).json();
  document.getElementById("who").textContent = (data.character || "").split("_").join(" ");
  document.getElementById("tags").textContent = data.text || "";
}

async function loadOutput() {
  const data = await (await fetch("/api/browse?root=output&path=" + encodeURIComponent(outputPath))).json();
  const box = document.getElementById("out");
  box.innerHTML = "";
  if (data.parent !== null && data.parent !== undefined) {
    const back = document.createElement("button");
    back.type = "button";
    back.textContent = "Назад";
    back.onclick = () => { outputPath = data.parent; loadOutput(); };
    box.appendChild(back);
  }
  for (const item of data.items || []) {
    const button = document.createElement("button");
    button.type = "button";
    button.textContent = item.dir ? "" : item.name;
    if (item.dir) {
      button.className = "folder";
      const icon = document.createElement("div");
      icon.className = "icon";
      const label = document.createElement("span");
      label.className = "name";
      label.textContent = item.name;
      button.append(icon, label);
    } else {
      button.className = "file";
    }
    button.onclick = () => {
      if (item.dir) {
        outputPath = item.path;
        loadOutput();
      } else {
        follow = false;
        showImage("output", item.path);
      }
    };
    box.appendChild(button);
  }
}

async function tick() {
  const data = await (await fetch("/api/status")).json();
  let step = data.step || "Жду.";
  const named = step.match(/Сейчас: размечаю (.+) \((\d+ из \d+)\)/);
  if (named) step = "Сейчас: размечаю " + fileName(named[1]) + " (" + named[2] + ").";
  document.getElementById("step").textContent = step;
  document.getElementById("detail").textContent = data.detail || "";
  document.getElementById("fill").style.width = (data.percent || 0) + "%";
  const log = document.getElementById("log");
  log.textContent = (data.log || []).join(String.fromCharCode(10));
  log.scrollTop = log.scrollHeight;
  const busy = data.job_running;
  const ready = data.model === "ready";
  const picked = selected.size > 0;
  for (const id of ["tag", "sort", "plan"]) {
    document.getElementById(id).disabled = busy || !picked || (id === "tag" && !ready);
  }
  document.getElementById("stop").disabled = !busy;
  document.getElementById("retry").hidden = data.model !== "error";
  if (follow && data.preview_file && data.preview_file !== (reel[reelAt] || "")) {
    if (!reel.includes(data.preview_file)) reel.push(data.preview_file);
    showAt(reel.indexOf(data.preview_file));
  }
}

async function start(mode) {
  await fetch("/api/job", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ mode, folders: [...selected] }),
  });
  follow = true;
  tick();
}

for (const id of ["tag", "sort", "plan"]) document.getElementById(id).onclick = () => start(id);
document.getElementById("stop").onclick = () => fetch("/api/stop", { method: "POST" });
document.getElementById("retry").onclick = () => fetch("/api/download", { method: "POST" });
document.getElementById("prev").onclick = () => { follow = false; showAt(reelAt - 1); };
document.getElementById("next").onclick = () => { follow = false; showAt(reelAt + 1); };
const zoom = document.getElementById("zoom");
const zoomImg = document.getElementById("zoom-img");
const view = { scale: 1, x: 0, y: 0, drag: null };
function paintZoom() {
  zoomImg.style.transform = "translate(" + view.x + "px, " + view.y + "px) scale(" + view.scale + ")";
  zoomImg.classList.toggle("zoomed", view.scale > 1);
}
function closeZoom() {
  zoom.hidden = true;
  view.drag = null;
}
document.getElementById("shot").onclick = () => {
  if (!document.getElementById("shot").src) return;
  view.scale = 1;
  view.x = 0;
  view.y = 0;
  view.drag = null;
  zoomImg.src = document.getElementById("shot").src;
  zoom.hidden = false;
  paintZoom();
};
document.getElementById("zoom-close").onclick = closeZoom;
document.addEventListener("keydown", (event) => {
  if (zoom.hidden) return;
  if (event.key === "Escape") closeZoom();
  if (event.key === "ArrowRight" || event.key === "ArrowLeft") {
    event.preventDefault();
    if (!reel.length) return;
    follow = false;
    showAt(reelAt + (event.key === "ArrowRight" ? 1 : -1));
    zoomImg.src = document.getElementById("shot").src;
    view.scale = 1;
    view.x = 0;
    view.y = 0;
    view.drag = null;
    paintZoom();
  }
});
zoom.addEventListener("wheel", (event) => {
  event.preventDefault();
  const next = view.scale * (event.deltaY < 0 ? 1.12 : 1 / 1.12);
  view.scale = Math.min(8, Math.max(1, next));
  if (view.scale === 1) {
    view.x = 0;
    view.y = 0;
  }
  paintZoom();
}, { passive: false });
zoomImg.addEventListener("mousedown", (event) => {
  if (event.button !== 0 || view.scale <= 1) return;
  view.drag = { x: event.clientX, y: event.clientY, ox: view.x, oy: view.y };
  event.preventDefault();
});
window.addEventListener("mousemove", (event) => {
  if (!view.drag) return;
  view.x = view.drag.ox + event.clientX - view.drag.x;
  view.y = view.drag.oy + event.clientY - view.drag.y;
  paintZoom();
});
window.addEventListener("mouseup", () => { view.drag = null; });
loadFolders();
loadOutput();
renderFolders();
tick();
setInterval(tick, 1000);
setInterval(loadFolders, 8000);
</script>
</body>
</html>
