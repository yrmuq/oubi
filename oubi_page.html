<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>oubi</title>
<style>
:root {
  color-scheme: light;
  --bg: #f2f2f2;
  --text: #1c1c1c;
  --muted: #5e5e5e;
  --pane: #fff;
  --line: #c6c6c6;
  --folder-tab: #d7a441;
  --folder: #e7b84a;
  --folder-front: #f6d78a;
  --folder-edge: #8a5a12;
  --yellow: #f5c400;
  --blue: #2f6fed;
  --iron-a: #f7f8f9;
  --iron-b: #8d98a3;
  --iron-c: #d5dbe0;
  --bar: #e4e4e4;
  --fill: #e7b341;
  --btn: #2c4a3e;
  --btn-2: #dedede;
  --btn-2-text: #1c1c1c;
  --danger: #8d3a3a;
  --pick: #c98400;
  --log: 200px;
  --search-bg: #fff;
  --search-edge: #c8c8c8;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #111;
    --text: #eee;
    --muted: #aaa;
    --pane: #161616;
    --line: #3a3a3a;
    --folder-tab: #e0b44a;
    --folder: #f0c85a;
    --folder-front: #ffe39a;
    --folder-edge: #6a4310;
    --yellow: #f5c400;
    --blue: #4c86ff;
    --iron-a: #f4f6f8;
    --iron-b: #7e8b97;
    --iron-c: #c5ced6;
    --bar: #2a2a2a;
    --fill: #e7b341;
    --btn: #2c4a3e;
    --btn-2: #333;
    --btn-2-text: #fff;
    --danger: #6e2e2e;
    --pick: #e7b341;
    --search-bg: #0c0c0c;
    --search-edge: #4a4a4a;
  }
}
html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text); font: 15px/1.4 system-ui, sans-serif; }
body { display: grid; grid-template-rows: auto minmax(0, 1fr); }
.topbar { display: flex; align-items: center; justify-content: space-between; height: 48px; padding: 0 16px; border-bottom: 1px solid var(--line); background: var(--pane); }
.brand { font-size: 18px; font-weight: 650; }
.themes { display: flex; gap: 4px; }
.themes button { padding: 4px 10px; background: var(--btn-2); color: var(--btn-2-text); }
.themes button.on { background: var(--btn); color: #fff; }
.top { display: grid; grid-template-columns: minmax(0, 1.15fr) 8px minmax(0, 1fr) 8px minmax(0, 1.15fr); min-height: 0; height: 100%; padding: 0 8px; }
.pane { border: 1px solid var(--line); border-bottom: 0; background: var(--pane); margin: 8px 0 0; padding: 12px; min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 0; position: relative; }
h1 { font-size: 16px; margin: 0 0 8px; font-weight: 600; }
.buttons { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
#all-folders { margin-left: auto; width: 32px; height: 32px; padding: 0; display: flex; align-items: center; justify-content: center; line-height: 0; }
#all-folders .box { width: 12px; height: 12px; border: 2px solid currentColor; border-radius: 2px; box-sizing: border-box; display: block; flex: 0 0 auto; }
#all-folders.on .box { background: currentColor; }
button { font: inherit; color: #fff; background: var(--btn); border: 0; border-radius: 8px; padding: 8px 10px; cursor: pointer; }
button.secondary { background: var(--btn-2); color: var(--btn-2-text); }
button.danger { background: var(--danger); color: #fff; }
button:disabled { opacity: 0.45; cursor: default; }
#folders { flex: 1; min-height: 0; overflow: auto; display: flex; flex-wrap: wrap; align-content: flex-start; gap: 14px; margin-top: 16px; margin-left: 16px; padding: 4px; }
.folder { width: 104px; background: transparent; color: inherit; border: 2px solid transparent; border-radius: 8px; padding: 4px; box-sizing: border-box; }
.folder .icon { width: 72px; height: 56px; margin: 0 auto 6px; position: relative; background: none; border: 0; }
.folder .icon svg { width: 100%; height: 100%; display: block; }
.folder .name { display: block; font-size: 12px; line-height: 1.2; word-break: break-word; }
.folder.on { border-color: var(--pick); }
.badge { position: absolute; bottom: 7px; width: 14px; height: 14px; border-radius: 50%; box-sizing: border-box; }
.badge.scan { left: 12px; }
.badge.sort { right: 12px; }
.badge.none { background: #8d8d8d; border: 1px solid #5a5a5a; }
.badge.part { background: #f5c400; border: 1px solid #8a6d00; }
.badge.done { background: #3dba6a; border: 1px solid #1e7a3a; }
.split { position: relative; touch-action: none; }
.split-v { cursor: col-resize; margin: 8px 0 0; }
.split-h { cursor: row-resize; }
.split-h::before { content: ""; position: absolute; left: 8px; right: 8px; top: 3px; height: 2px; background: var(--line); border-radius: 99px; }
.split-v::after, .split-h::after { content: ""; position: absolute; }
.split-v::after { left: -6px; right: -6px; top: 0; bottom: 0; }
.split-h::after { left: 8px; right: 8px; top: -6px; bottom: -6px; }
.step { margin: 0; }
.bar { height: 10px; background: var(--bar); border-radius: 99px; overflow: hidden; }
.bar > div { height: 100%; width: 0; background: var(--fill); }
.detail { color: var(--muted); min-height: 1.2em; }
.mid { position: relative; text-align: center; gap: 0; display: flex; flex-direction: column; }
.block { min-width: 0; min-height: 0; position: relative; }
.block.grow { flex: 1 1 0; display: flex; flex-direction: column; overflow: hidden; }
.block-split { flex: 0 0 8px; height: 8px; margin: 6px 0; }
.edge-split { position: absolute; left: 0; right: 0; bottom: 0; height: 10px; margin: 0; z-index: 3; }
body.arrange .block { outline: 1px dashed var(--pick); cursor: grab; border-radius: 8px; }
body.arrange .block * { pointer-events: none; }
.block.dragging { opacity: 0.4; }
.block.drop-before { box-shadow: inset 0 3px 0 var(--pick); }
.block.drop-after { box-shadow: inset 0 -3px 0 var(--pick); }
.head-tools { display: flex; align-items: center; gap: 8px; }
#arrange { width: 32px; height: 32px; padding: 0; background: var(--btn-2); color: var(--text); }
#arrange.on { background: var(--pick); color: #111; }
#lang { height: 32px; padding: 0 8px; background: var(--btn-2); color: var(--text); }
#preview { min-height: 0; flex: 1; display: flex; flex-direction: column; }
#shot { width: 100%; flex: 1 1 auto; min-height: 80px; object-fit: contain; background: #000; border: 1px solid var(--line); cursor: zoom-in; }
#switch { position: relative; width: 100%; height: 44px; flex: 0 0 44px; margin-bottom: 8px; }
#prev, #next { position: absolute; top: 0; z-index: 2; height: 44px; margin: 0; padding: 0 10px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; line-height: 1; background: transparent; color: var(--text); font-size: 22px; }
#prev { left: 0; }
#next { right: 0; }
#name { position: absolute; left: 48px; right: 48px; top: 0; height: 44px; margin: 0; display: flex; align-items: center; justify-content: center; line-height: 1; text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#who { margin: 0; min-height: 1.2em; font-size: 22px; font-weight: 700; }
#tags { white-space: pre-wrap; margin: 0; width: 100%; overflow: auto; }
#genre-row { display: flex; flex-wrap: wrap; gap: 8px 16px; width: 100%; flex: 1; min-height: 0; overflow: auto; align-items: flex-start; align-content: flex-start; }
.genre-slot { display: flex; gap: 6px; align-items: center; flex: 1 1 180px; max-width: 280px; min-width: 0; overflow: hidden; }
.genre-handle, .genre-pin { width: 22px; height: 28px; padding: 0; border-radius: 6px; flex: 0 0 22px; box-sizing: border-box; }
.genre-handle { cursor: grab; color: #111; }
.genre-pin { background: var(--btn-2); color: var(--text); border: 2px solid transparent; }
.genre-pin.on { background: var(--pick); border-color: var(--pick); color: #111; }
.genre-field { position: relative; flex: 1 1 auto; min-width: 0; overflow: hidden; }
.genre-field input, .genre-ghost { font: inherit; padding: 4px 6px; box-sizing: border-box; }
.genre-ghost { position: absolute; inset: 0; z-index: 2; color: var(--muted); pointer-events: none; white-space: pre; overflow: visible; border: 1px solid transparent; }
#suggest { position: fixed; z-index: 30; max-height: 180px; overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 8px 24px rgba(0,0,0,.28); }
#suggest button { display: block; width: 100%; text-align: left; background: transparent; color: var(--text); border: 0; border-radius: 0; padding: 6px 8px; }
#suggest button.on { background: var(--line); }
.ghost-tail { color: var(--muted); }
.genre-field input { position: relative; display: block; width: 100%; min-width: 0; max-width: 100%; color: var(--text); background: transparent; border: 1px solid var(--line); border-radius: 6px; }
#genre-add { width: 32px; height: 32px; padding: 0; flex: 0 0 auto; }
.tag-hit { cursor: pointer; border-radius: 4px; padding: 0 3px; }
.filter-find { margin: 0 0 8px; background: var(--search-bg); border: 1px solid var(--search-edge); border-radius: 6px; }
.filter-find input, .filter-find .genre-ghost { border: 0; background: transparent; padding-right: 30px; }
.search-icon { position: absolute; right: 8px; top: 50%; width: 16px; height: 16px; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
.filter-tag { color: #111; border-radius: 6px; }
.genre { border-radius: 4px; padding: 0 3px; color: #111; }
.genre-1, .genre-handle.genre-1 { background: #ffb4b4; }
.genre-2, .genre-handle.genre-2 { background: #b9d0ff; }
.genre-3, .genre-handle.genre-3 { background: #b7efc9; }
.genre-4, .genre-handle.genre-4 { background: #ffd39a; }
.genre-5, .genre-handle.genre-5 { background: #e0c2ff; }
.genre-6, .genre-handle.genre-6 { background: #b8efe8; }
.genre-7, .genre-handle.genre-7 { background: #ffc4e0; }
.genre-8, .genre-handle.genre-8 { background: #f3e7a1; }
.genre-9, .genre-handle.genre-9 { background: #d7c4b0; }
.genre-10, .genre-handle.genre-10 { background: #d5dbe3; }
#right { padding: 12px; display: flex; flex-direction: column; gap: 0; }
#info { min-height: 0; flex: 1; overflow: auto; display: flex; flex-direction: column; gap: 8px; text-align: left; }
#right .split-h { margin: 0; }
.genre-11, .genre-handle.genre-11 { background: #c9e8a9; }
.genre-12, .genre-handle.genre-12 { background: #f7c6b2; }
.genre-13, .genre-handle.genre-13 { background: #c5d4f7; }
.genre-14, .genre-handle.genre-14 { background: #f8e1b0; }
.genre-15, .genre-handle.genre-15 { background: #e7b7d8; }
.genre-16, .genre-handle.genre-16 { background: #bfe3d4; }
.genre-17, .genre-handle.genre-17 { background: #f0d0c0; }
.genre-18, .genre-handle.genre-18 { background: #d4c6f2; }
.genre-19, .genre-handle.genre-19 { background: #ead9a4; }
.genre-20, .genre-handle.genre-20 { background: #c8d5dc; }
.log { margin: 0; border: 0; flex: 1; min-height: 0; background: #000; color: #e6e6e6; overflow: auto; padding: 8px; white-space: pre-wrap; font: 13px/1.35 ui-monospace, monospace; }
#zoom { position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center; overflow: hidden; background: #000; }
#zoom[hidden] { display: none; }
#zoom-close { position: absolute; top: 12px; right: 12px; z-index: 2; font-size: 32px; line-height: 1; background: transparent; color: #fff; }
#zoom-img { max-width: 100%; max-height: 100%; transform-origin: center center; user-select: none; }
#zoom-img.zoomed { cursor: grab; }
html[data-theme="light"] {
  color-scheme: light;
  --bg: #f2f2f2; --text: #1c1c1c; --muted: #5e5e5e; --pane: #fff; --line: #c6c6c6;
  --folder-tab: #d7a441; --folder: #e7b84a; --folder-front: #f6d78a; --folder-edge: #8a5a12;
  --bar: #e4e4e4; --btn-2: #dedede; --btn-2-text: #1c1c1c; --danger: #8d3a3a; --pick: #c98400;
  --search-bg: #fff; --search-edge: #c8c8c8;
}
html[data-theme="dark"] {
  color-scheme: dark;
  --bg: #111; --text: #eee; --muted: #aaa; --pane: #161616; --line: #3a3a3a;
  --folder-tab: #e0b44a; --folder: #f0c85a; --folder-front: #ffe39a; --folder-edge: #6a4310;
  --yellow: #f5c400; --blue: #4c86ff; --iron-a: #f4f6f8; --iron-b: #7e8b97; --iron-c: #c5ced6;
  --bar: #2a2a2a; --btn-2: #333; --btn-2-text: #fff; --danger: #6e2e2e; --pick: #e7b341;
  --search-bg: #0c0c0c; --search-edge: #4a4a4a;
}
</style>
<script>
var savedTheme = "__OUBI_THEME__";
if (savedTheme === "light" || savedTheme === "dark") document.documentElement.setAttribute("data-theme", savedTheme);
</script>
</head>
<body>
<header class="topbar">
  <span class="brand">oubi</span>
  <div class="head-tools">
    <button id="arrange" type="button" title="Move blocks">✎</button>
    <button id="lang" type="button" title="Language">EN</button>
    <div class="themes">
    <button type="button" data-theme="light">светлая</button>
    <button type="button" data-theme="dark">тёмная</button>
    <button type="button" data-theme="auto">auto</button>
    </div>
  </div>
</header>
<div class="top">
  <section class="pane" id="left">
    <div class="block" data-block="buttons">
      <div class="buttons">
        <button id="tag">Опознать</button>
        <button id="sort">Сортировать</button>
        <button id="plan" class="secondary">План сортировки</button>
        <button id="stop" class="danger" disabled>Остановить</button>
        <button id="retry" class="secondary" hidden>Повторить скачивание модели</button>
        <button id="all-folders" class="secondary" type="button" title="Select all folders"><span class="box"></span></button>
      </div>
    </div>
    <div class="block grow" data-block="folders">
      <div id="folders"></div>
    </div>
    <div class="block" data-block="progress">
      <p id="step" class="step">Открываю…</p>
      <div class="bar"><div id="fill"></div></div>
      <p id="detail" class="detail"></p>
    </div>
  </section>
  <div class="split split-v" id="split-left"></div>
  <section class="pane mid" id="mid">
    <div class="block grow" data-block="preview">
      <div id="preview">
        <img id="shot" alt="">
        <div id="switch">
          <button id="prev" type="button">❮</button>
          <span id="name">filename</span>
          <button id="next" type="button">❯</button>
        </div>
      </div>
    </div>
    <div class="block grow" data-block="genres">
      <div id="genre-row"></div>
    </div>
  </section>
  <div class="split split-v" id="split-mid"></div>
  <section class="pane" id="right">
    <div class="block grow" data-block="info">
      <div id="info">
        <p id="who"></p>
        <p id="tags">Select a file to show tags</p>
      </div>
    </div>
    <div class="block" data-block="filter">
      <div class="genre-field filter-find">
        <span id="filter-ghost" class="genre-ghost"></span>
        <input id="filter-query" spellcheck="false" autocomplete="off">
        <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M15.2 15.2 L21 21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </div>
      <div id="filter"></div>
    </div>
    <div class="block grow" data-block="log">
      <pre id="log" class="log"></pre>
    </div>
  </section>
</div>
<div id="suggest" hidden></div>
<div id="zoom" hidden>
  <button id="zoom-close" type="button">×</button>
  <img id="zoom-img" alt="">
</div>
<script>
const selected = new Set();
let folders = FOLDERS_JSON;
let reel = [];
let reelAt = -1;
let follow = true;
let shown = "";
let genres = __OUBI_GENRES__;
let layout = __OUBI_LAYOUT__;
let lang = "__OUBI_LANG__";
const catalogs = __OUBI_LANGS__;
let tagText = "";
let hasFile = false;
let pinned = [];
let theme = savedTheme === "light" || savedTheme === "dark" || savedTheme === "auto" ? savedTheme : "auto";
let wasBusy = false;
const panes = { left: null, mid: null, right: null };

function fileName(path) {
  const parts = String(path || "").split("/");
  return parts[parts.length - 1] || "";
}

function t(id) {
  const pack = catalogs[lang] || catalogs.en || {};
  const english = catalogs.en || {};
  return pack[String(id)] || english[String(id)] || "";
}

function showEmpty() {
  hasFile = false;
  shown = "";
  const shot = document.getElementById("shot");
  shot.removeAttribute("src");
  document.getElementById("name").textContent = t(11);
  document.getElementById("who").textContent = "";
  tagText = "";
  document.getElementById("tags").textContent = t(12);
}

function applyI18n() {
  document.getElementById("tag").textContent = t(1);
  document.getElementById("sort").textContent = t(2);
  document.getElementById("plan").textContent = t(3);
  document.getElementById("stop").textContent = t(4);
  document.getElementById("retry").textContent = t(5);
  document.querySelector('.themes [data-theme="light"]').textContent = t(8);
  document.querySelector('.themes [data-theme="dark"]').textContent = t(9);
  document.querySelector('.themes [data-theme="auto"]').textContent = t(10);
  document.getElementById("arrange").title = t(20);
  document.getElementById("all-folders").title = t(83);
  document.getElementById("lang").title = t(21);
  document.getElementById("lang").textContent = lang === "ru" ? "RU" : "EN";
  if (!hasFile) showEmpty();
  renderFolders();
  if (document.getElementById("genre-1") || document.querySelector(".genre-pin")) renderGenreRow();
}

function badge(kind, state) {
  const title = {
    scan: { none: t(13), part: t(14), done: t(15) },
    sort: { none: t(16), part: t(17), done: t(18) },
  }[kind][state] || "";
  if (!title) return "";
  return `<span class="badge ${kind} ${state}" title="${title}"></span>`;
}

function folderIcon(scan, sort) {
  const icon = document.createElement("div");
  icon.className = "icon";
  icon.innerHTML = `<svg viewBox="0 0 64 52" aria-hidden="true">
    <path fill="var(--folder-tab)" d="M8 18h14l4-8h24a4 4 0 0 1 4 4v8H8z"/>
    <path fill="var(--folder)" stroke="var(--folder-edge)" stroke-width="1.4" d="M4 18h56a4 4 0 0 1 4 4v22a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4V18z"/>
    <path fill="var(--folder-front)" d="M4 28h56v16a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4V28z"/>
  </svg>` + badge("scan", scan) + badge("sort", sort);
  return icon;
}

function renderFolders() {
  const box = document.getElementById("folders");
  box.innerHTML = "";
  for (const folder of folders) {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "folder" + (selected.has(folder.path) ? " on" : "");
    const label = document.createElement("span");
    label.className = "name";
    label.textContent = folder.name;
    button.append(folderIcon(folder.scan, folder.sort), label);
    button.onclick = () => {
      if (selected.has(folder.path)) selected.delete(folder.path);
      else selected.add(folder.path);
      renderFolders();
      loadRecent();
    };
    box.appendChild(button);
  }
  const all = document.getElementById("all-folders");
  if (all) all.classList.toggle("on", folders.length > 0 && folders.every((folder) => selected.has(folder.path)));
}

function takeFolders(data) {
  const prev = new Map(folders.map((folder) => [folder.path, folder]));
  folders = data.map((folder) => {
    if (!folder.scan && prev.has(folder.path) && prev.get(folder.path).scan) {
      const old = prev.get(folder.path);
      return Object.assign({}, folder, { scan: old.scan, sort: old.sort });
    }
    return folder;
  });
  renderFolders();
}

async function loadFolders() {
  try {
    const data = await (await fetch("/api/folders")).json();
    if (!Array.isArray(data)) return;
    takeFolders(data);
  } catch (error) {
    return;
  }
}

async function loadRecent() {
  if (pinned.length) return;
  if (!selected.size) {
    reel = [];
    showEmpty();
    return;
  }
  const query = [...selected].map((folder) => "folder=" + encodeURIComponent(folder)).join("&");
  const data = await (await fetch("/api/recent?" + query)).json();
  reel = data.files || [];
  if (!reel.length) showEmpty();
  else if (follow && reel.length) showAt(reel.length - 1);
}

function rainbow(index) {
  return "hsl(" + ((index * 47) % 360) + " 78% 72%)";
}

function pinIndex(tag) {
  const key = String(tag || "").trim().toLowerCase();
  return pinned.findIndex((item) => item.toLowerCase() === key);
}

function renderFilter() {
  const box = document.getElementById("filter");
  if (!box) return;
  box.replaceChildren();
  pinned.forEach((tag, index) => {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "filter-tag";
    button.style.background = rainbow(index);
    button.textContent = tag;
    button.onclick = () => togglePin(tag);
    box.append(button);
  });
}

function addFilterTag(raw) {
  const token = String(raw || "").trim();
  if (!token || pinIndex(token) >= 0) return;
  pinned.push(token);
  renderFilter();
  paintTags(tagText);
  renderGenreRow();
  applyFilter();
}

function togglePin(tag) {
  const token = String(tag || "").trim();
  if (!token) return;
  const index = pinIndex(token);
  if (index >= 0) pinned.splice(index, 1);
  else pinned.push(token);
  renderFilter();
  paintTags(tagText);
  renderGenreRow();
  applyFilter();
}

async function applyFilter() {

function dragSplit(which, event) {

      const floor = Math.min(96, pair / 2);

      panes.left = next;
      panes.mid = pair - next;
      panes.right = start.right;
    } else if (which === "mid") {
      const pair = start.mid + start.right;

      const next = Math.min(pair - floor, Math.max(floor, start.mid + ev.clientX - start.x));

function tagList() {
  return String(tagText || "").split(",").map((part) => part.trim()).filter(Boolean);

function pendingTags(prefix) {
  const folded = String(prefix || "").trim().toLowerCase();
  if (!folded) return [];
  return tagList().filter((item) => {
    const key = item.toLowerCase();
    return key.startsWith(folded) && key.length > folded.length;
  });
}

function matchTag(prefix) {
  const typed = String(prefix || "");
  const tags = pendingTags(typed);
  if (!tags.length) return null;
  const tag = tags[Math.min(suggestPick, tags.length - 1)];
  return { tag, used: typed.length };
}

function hideSuggest() {

function showSuggest(input) {
  const box = document.getElementById("suggest");
  const tags = pendingTags(input.value);
  if (document.activeElement !== input || !tags.length) {
    if (document.activeElement !== input) return;
    hideSuggest();
    return;
  }
  suggestPick = Math.min(suggestPick, tags.length - 1);
  box.innerHTML = "";
  tags.forEach((tag, index) => {
    const button = document.createElement("button");
    button.type = "button";
    button.textContent = tag;
    if (index === suggestPick) button.className = "on";
    button.onmousedown = (event) => {
      event.preventDefault();
      suggestPick = 0;
      input.value = tag;
      takeSuggestion(input);
    };
    box.append(button);
  });
  const rect = input.getBoundingClientRect();
  box.hidden = false;

function takeSuggestion(input) {

    : input.parentElement.querySelector(".genre-ghost");
  if (input.id !== "filter-query") {
    const index = [...document.querySelectorAll("#genre-row .genre-field input")].indexOf(input);
    if (index >= 0) {
      genres[index] = input.value.trim();
      paintTags(tagText);
      saveGenres();
    }
  }
  applyGhost(input, ghost);
}

function applyGhost(input, ghost) {
  if (!ghost) return;
  ghost.style.paddingLeft = "";
  ghost.replaceChildren();
  const found = matchTag(input.value);
  if (!found) {
    showSuggest(input);
    return;

  const typed = document.createElement("span");

  typed.textContent = input.value;
  const tail = document.createElement("span");
  tail.className = "ghost-tail";
  tail.textContent = found.tag.slice(found.used);
  ghost.style.font = getComputedStyle(input).font;
  ghost.append(typed, tail);
  showSuggest(input);

}, { passive: false });
zoomImg.addEventListener("mousedown", (event) => {
  if (event.button !== 0 || view.scale <= 1) return;
  view.drag = { x: event.clientX, y: event.clientY, ox: view.x, oy: view.y };
  event.preventDefault();
});
window.addEventListener("mousemove", (event) => {
  if (!view.drag) return;
  view.x = view.drag.ox + event.clientX - view.drag.x;
  view.y = view.drag.oy + event.clientY - view.drag.y;
  paintZoom();
});
window.addEventListener("mouseup", () => { view.drag = null; });
loadFolders();
renderFolders();
tick();
setInterval(tick, 1000);
setInterval(loadFolders, 8000);
</script>
</body>
</html>
