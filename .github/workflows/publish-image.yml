name: Publish an Oubi image

on:
  workflow_call:
    inputs:
      channel:
        required: true
        type: string
      ref:
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    concurrency:
      group: oubi-publish-${{ inputs.channel }}
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
    env:
      IMAGE: ghcr.io/yrmuq/oubi
      CHANNEL: ${{ inputs.channel }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Determine the release source and image tags
        id: image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/publish-image.sh prepare
      - name: Test stable and dependency releases
        if: ${{ steps.image.outputs.source != '' && inputs.channel != 'dev' }}
        run: sh scripts/check.sh
      - name: Build the candidate
        if: ${{ steps.image.outputs.source != '' && inputs.channel != 'dev' }}
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: oubi:smoke
          labels: ${{ steps.image.outputs.labels }}
          cache-from: type=gha,scope=oubi-bookworm-3.12-amd64
          cache-to: type=gha,mode=max,scope=oubi-bookworm-3.12-amd64
      - name: Start the candidate
        if: ${{ steps.image.outputs.source != '' && inputs.channel != 'dev' }}
        run: sh scripts/smoke-container.sh oubi:smoke linux/amd64
      - name: Build the TPM service candidate
        if: ${{ steps.image.outputs.tpm_tags != '' }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: tpm/Dockerfile
          platforms: linux/amd64
          load: true
          tags: oubi-tpm:smoke
          cache-from: type=gha,scope=oubi-tpm-alpine-amd64
          cache-to: type=gha,mode=max,scope=oubi-tpm-alpine-amd64
      - name: Start the TPM service candidate
        if: ${{ steps.image.outputs.tpm_tags != '' }}
        run: sh scripts/smoke-tpm.sh oubi-tpm:smoke
      - name: Reserve the dependency release version
        if: ${{ steps.image.outputs.source != '' && inputs.channel == 'deps' }}
        env:
          RELEASE_VERSION: ${{ steps.image.outputs.version }}
          SOURCE_SHA: ${{ steps.image.outputs.source }}
        run: git push origin "$SOURCE_SHA:refs/tags/v$RELEASE_VERSION"
      - name: Publish immutable tags
        if: ${{ steps.image.outputs.tags != '' }}
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.tags }}
          labels: ${{ steps.image.outputs.labels }}
          cache-from: type=gha,scope=oubi-bookworm-3.12-amd64
          cache-to: type=gha,mode=max,scope=oubi-bookworm-3.12-amd64
      - name: Publish immutable TPM service tags
        if: ${{ steps.image.outputs.tpm_tags != '' }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: tpm/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.tpm_tags }}
          labels: ${{ steps.image.outputs.labels }}
          cache-from: type=gha,scope=oubi-tpm-alpine-amd64
          cache-to: type=gha,mode=max,scope=oubi-tpm-alpine-amd64
      - name: Verify the published images and update their release channel
        if: ${{ steps.image.outputs.source != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ steps.image.outputs.source }}
          RELEASE_VERSION: ${{ steps.image.outputs.version }}
        run: bash scripts/publish-image.sh finish
