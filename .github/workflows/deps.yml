name: Dependencies

on:
  push:
    branches: [deps, main]
  schedule:
    - cron: '0 9 * * 5'
  workflow_dispatch:
    inputs:
      security_fingerprint:
        description: Fingerprint of fixable findings in the published images
        type: string
  workflow_call:

jobs:
  sync-main:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: oubi-dependency-updates
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Synchronize the dependency branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          sh scripts/sync-deps.sh

  update-pins:
    if: ${{ github.event_name != 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: oubi-dependency-updates
      cancel-in-progress: false
    outputs:
      ref: ${{ steps.update.outputs.ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.4.0
      - name: Refresh dependency locks and the base system packages
        id: update
        env:
          GH_TOKEN: ${{ github.token }}
          SECURITY_FINGERPRINT: ${{ inputs.security_fingerprint }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          sh scripts/sync-deps.sh
          git fetch origin deps
          git switch --detach origin/deps
          report_dir=$(mktemp -d)
          base=$(awk '/ AS python-base$/ {print $2}' Dockerfile)
          docker run --rm -v "$report_dir:/report" "$base" \
            python -m pip install --quiet --dry-run --ignore-installed --only-binary=:all: \
            --index-url https://download.pytorch.org/whl/cpu --report /report/resolve.json torch torchvision
          python3 scripts/update-torch-pins.py "$report_dir/resolve.json"
          sh scripts/lock-cpu.sh
          python3 scripts/update-gpu-pins.py
          python3 scripts/cryptomator-cli.py update dependencies/cryptomator.json
          if [[ -n "$SECURITY_FINGERPRINT" ]]; then
            [[ $SECURITY_FINGERPRINT =~ ^[0-9a-f]{64}$ ]]
            printf '%s\n' "$SECURITY_FINGERPRINT" > dependencies/security-refresh.txt
            printf '%s %s\n' "$(date -u +%F)" "$SECURITY_FINGERPRINT" > dependencies/os-refresh.txt
          else
            date -u +%G-W%V > dependencies/os-refresh.txt
          fi
          if ! git diff --quiet -- dependencies; then
            git add dependencies
            git commit -m 'Refresh dependency locks and system packages'
            git push origin HEAD:refs/heads/deps
            echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

  prerelease:
    needs: update-pins
    if: ${{ !cancelled() && (github.ref == 'refs/heads/deps' || needs.update-pins.outputs.ref != '') }}
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/publish-image.yml
    with:
      channel: deps
      ref: ${{ needs.update-pins.outputs.ref || github.sha }}
