name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ !contains(github.event.head_commit.message, '[release]') }}
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/publish-image.yml
    with:
      channel: stable
      ref: ${{ github.sha }}

  sync:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      dev_sha: ${{ steps.sync.outputs.dev_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Synchronize the development branch
        id: sync
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin dev main
          git switch --detach origin/dev
          git merge --no-edit origin/main
          git push origin HEAD:refs/heads/dev
          echo "dev_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  refresh-dev:
    needs: sync
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/image.yml
    with:
      ref: ${{ needs.sync.outputs.dev_sha }}

  sync-deps:
    needs: publish
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/deps.yml
