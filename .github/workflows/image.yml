name: Publish dev image

on:
  push:
    branches: [dev]

jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: dev-checks
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test
        run: |
          bash tests/bump-version.test.sh
          python -m unittest tests.test_tag_folder tests.test_web
          sh -n entrypoint.sh

  publish:
    needs: checks
    concurrency:
      group: dev-image-push
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish-image.yml
    with:
      tag: dev
      ref: ${{ github.sha }}
    secrets: inherit
