name: Publish dev image

on:
  push:
    branches: [dev]
  workflow_call:
    inputs:
      ref:
        required: true
        type: string

jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: dev-image-checks
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: sh scripts/check.sh
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: oubi:smoke
          cache-from: type=gha,scope=oubi-bookworm-3.12-amd64
          cache-to: type=gha,mode=max,scope=oubi-bookworm-3.12-amd64
      - run: sh scripts/smoke-container.sh oubi:smoke linux/amd64

  publish:
    needs: checks
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/publish-image.yml
    with:
      channel: dev
      ref: ${{ inputs.ref || github.sha }}
