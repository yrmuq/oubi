version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: friday
      time: "09:00"
      timezone: UTC
    target-branch: deps
    groups:
      actions:
        patterns:
          - "*"
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: friday
      time: "09:00"
      timezone: UTC
    target-branch: deps
    groups:
      docker:
        patterns:
          - "*"
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: friday
      time: "09:00"
      timezone: UTC
    target-branch: deps
    groups:
      pip:
        patterns:
          - "*"
  - package-ecosystem: docker
    directory: /tpm
    schedule:
      interval: weekly
      day: friday
      time: "09:00"
      timezone: UTC
    target-branch: deps
    groups:
      tpm-images:
        patterns:
          - "*"
  - package-ecosystem: gomod
    directory: /tpm
    schedule:
      interval: weekly
      day: friday
      time: "09:00"
      timezone: UTC
    target-branch: deps
    groups:
      tpm-go:
        patterns:
          - "*"
